name: Ask Manual Card Dates

on:
  schedule:
    # HSBC: ngày chốt sao kê 5 → hỏi ngày 7 lúc 8:00 AM GMT+7 (01:00 UTC)
    - cron: "0 1 7 * *"
    # VIB: ngày chốt sao kê 25 → hỏi ngày 27
    - cron: "0 1 27 * *"
    # VPBank: ngày chốt sao kê 27 → hỏi ngày 29
    - cron: "0 1 29 * *"
  workflow_dispatch:
    inputs:
      bank:
        description: "Ngân hàng cần hỏi (HSBC / VIB / VPBank / all)"
        required: false
        default: "all"

jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Send Telegram prompt
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          ASK_BANK: ${{ github.event.inputs.bank || 'auto' }}
        run: python main.py ask
