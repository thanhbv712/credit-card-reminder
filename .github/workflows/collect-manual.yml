name: Collect Manual Card Dates

on:
  schedule:
    # Thu thập reply sau 12 tiếng: ngày 7, 27, 29 lúc 8:00 PM GMT+7 (13:00 UTC)
    - cron: "0 13 7 * *"
    - cron: "0 13 27 * *"
    - cron: "0 13 29 * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # cần để commit manual_dates.json

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Collect Telegram replies
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: python main.py collect

      - name: Commit updated manual_dates.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manual_dates.json telegram_offset.txt
          git diff --staged --quiet || git commit -m "Update manual card dates [skip ci]"
          git push
